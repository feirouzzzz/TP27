version: "3.9"

services:

  database:
    image: mysql:8.4
    container_name: mysql-db
    environment:
      MYSQL_DATABASE: library_db
      MYSQL_USER: library_user
      MYSQL_PASSWORD: library_pass
      MYSQL_ROOT_PASSWORD: root_pass
    ports:
      - "3306:3306"
    volumes:
      - db_volume:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot_pass" ]
      interval: 5s
      timeout: 3s
      retries: 15

  pricing-api:
    build:
      context: ./pricing-service
    container_name: pricing-api
    ports:
      - "8082:8082"
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:8082/actuator/health || exit 1" ]
      interval: 5s
      timeout: 3s
      retries: 15

  book-node-a:
    build:
      context: ./book-service
    container_name: book-service-a
    environment:
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "8081:8081"
    depends_on:
      database:
        condition: service_healthy
      pricing-api:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:8081/actuator/health || exit 1" ]
      interval: 5s
      timeout: 3s
      retries: 15

  book-node-b:
    build:
      context: ./book-service
    container_name: book-service-b
    environment:
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "8083:8081"
    depends_on:
      database:
        condition: service_healthy
      pricing-api:
        condition: service_healthy

  book-node-c:
    build:
      context: ./book-service
    container_name: book-service-c
    environment:
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "8084:8081"
    depends_on:
      database:
        condition: service_healthy
      pricing-api:
        condition: service_healthy

volumes:
  db_volume:
